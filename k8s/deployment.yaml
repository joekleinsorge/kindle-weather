apiVersion: apps/v1
kind: Deployment
metadata:
  name: kindle-weather
  labels:
    app: kindle-weather
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kindle-weather
  template:
    metadata:
      labels:
        app: kindle-weather
    spec:
      containers:
      - name: kindle-weather
        image: ghcr.io/joekleinsorge/kindle-weather/kindle-weather:latest
        imagePullPolicy: Always
        env:
        - name: CACHE_EXPIRATION
          value: "1800"
        - name: CACHE_CLEANUP_INTERVAL
          value: "3600"
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "128Mi"
            cpu: "100m"
          requests:
            cpu: "25m"
            memory: "32Mi"
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 30
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        volumeMounts:
        - name: secrets
          mountPath: "/etc/secrets"
          readOnly: true
      volumes:
      - name: secrets
        secret:
          secretName: api-keys
      automountServiceAccountToken: false
