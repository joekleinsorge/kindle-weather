<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description"
     width="{{if .Horizontal}}1024{{else}}758{{end}}" height="{{if .Horizontal}}758{{else}}1024{{end}}"
     viewBox="0 0 {{if .Horizontal}}1024 758{{else}}758 1024{{end}}">
  <title id="title">Weather and tide dashboard</title>
  <desc id="description">{{.Summary}}</desc>
  <rect width="100%" height="100%" fill="white"/>
  <!-- The overview is drawn once at 758×1024; landscape scales it to fit the shorter screen. -->
  <g font-family="Arial, Helvetica, sans-serif" fill="black"{{if .Horizontal}} transform="translate(232 0) scale(0.74)"{{end}}>
    <text x="40" y="42" font-size="22" font-weight="bold" letter-spacing="1">CRESCENT BEACH</text>
    {{if .NowLabel}}<text x="718" y="42" font-size="22" font-weight="bold" text-anchor="end">{{.NowLabel}}</text>{{end}}
    <line x1="0" y1="58" x2="758" y2="58" stroke="black" stroke-width="2"/>
    {{if .StaleText}}
    <rect x="0" y="58" width="758" height="42"/>
    <text x="40" y="87" font-size="24" font-weight="bold" fill="white">{{.StaleText}}</text>
    {{end}}
    {{range $i, $n := .OverviewNotices}}<text x="40" y="{{if $i}}165{{else}}132{{end}}" font-size="24" font-weight="bold">{{$n.Text}}</text>{{end}}

    <text x="34" y="320" font-size="170" font-weight="bold" letter-spacing="-6"{{if .WeatherAsOf}} fill="#777"{{end}}>{{.CurrentTemperature}}</text>
    {{if .Condition}}<text x="40" y="362" font-size="30">{{.Condition}}</text>{{end}}
    {{if .DailyRange}}<text x="40" y="398" font-size="26" font-weight="bold">{{.DailyRange}}</text>{{end}}
    {{if .WeatherAsOf}}<text x="718" y="320" font-size="32" font-weight="bold" text-anchor="end">{{.WeatherAsOf}}</text>
    {{else if .FeelsLike}}<text x="718" y="320" font-size="32" font-weight="bold" text-anchor="end">feels {{.FeelsLike}}°</text>{{end}}

    {{with .Rain}}
    <g transform="translate(0 420)">
      {{if .Likely}}<rect width="758" height="180"/>{{else}}<line x1="0" y1="1" x2="758" y2="1" stroke="black" stroke-width="3"/>{{end}}
      <g{{if .Likely}} fill="white"{{end}}>
        <text x="40" y="44" font-size="26" font-weight="bold" letter-spacing="1">{{.Label}}</text>
        <text x="40" y="150" font-size="110" font-weight="bold">{{.Big}}{{if .Suffix}}<tspan font-size="44"> {{.Suffix}}</tspan>{{end}}</text>
        <text x="718" y="150" font-size="26" font-weight="bold" text-anchor="end">{{.Caption}}</text>
      </g>
    </g>
    {{end}}

    <line x1="0" y1="600" x2="758" y2="600" stroke="black" stroke-width="3"/>
    {{with .Tide}}
    <g transform="translate(0 600)">
      <text x="40" y="44" font-size="26" font-weight="bold" letter-spacing="1">{{.Label}}</text>
      <text x="40" y="150" font-size="110" font-weight="bold">{{.Big}}<tspan font-size="44"> {{.Suffix}}</tspan></text>
      {{if .Spark}}<g transform="translate(498 30)">{{.Spark}}</g>{{end}}
      <text x="718" y="150" font-size="26" font-weight="bold" text-anchor="end">{{.Caption}}</text>
    </g>
    {{end}}

    <line x1="0" y1="780" x2="758" y2="780" stroke="black" stroke-width="3"/>
    {{with .BeachStatus}}
    <g transform="translate(0 780)">
      <text x="40" y="44" font-size="26" font-weight="bold" letter-spacing="1">{{if .Label}}{{.Label}}{{else}}BEACH{{end}}</text>
      {{if .Big}}
      <text x="40" y="130" font-size="90" font-weight="bold">{{.Big}}{{if .Suffix}}<tspan font-size="40"> {{.Suffix}}</tspan>{{end}}</text>
      {{range $i, $line := lines .Detail}}<text x="718" y="{{if $i}}130{{else}}98{{end}}" font-size="26" font-weight="bold" text-anchor="end">{{$line}}</text>{{end}}
      {{else}}
      <text x="40" y="100" font-size="34" font-weight="bold">{{.Text}}</text>
      {{end}}
    </g>
    <line x1="0" y1="940" x2="758" y2="940" stroke="black" stroke-width="3"/>
    {{end}}

    <g font-size="26" font-weight="bold">
      {{if .MoonPercent}}<text x="40" y="992">Moon {{.MoonPercent}}</text>{{end}}
      {{if .SunEventTime}}<text x="379" y="992" text-anchor="middle">{{.SunEventLabel}} {{.SunEventTime}}</text>
      {{else}}<text x="379" y="992" text-anchor="middle">sunset {{.Sunset}}</text>{{end}}
      {{if .KennedyLaunch}}<text x="718" y="992" text-anchor="end">launch {{.KennedyLaunch.Scheduled}}</text>{{end}}
    </g>
  </g>
</svg>
